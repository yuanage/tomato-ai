<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover：适配安卓刘海屏 / 底部手势条的安全区域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111314" />
    <!-- 字体：不使用外部 CDN（避免安卓设备 DNS 解析失败 ERR_NAME_NOT_RESOLVED），
         字体栈在 base.css 中回退系统字体（Roboto → Noto Sans SC → 系统中文字体） -->
    <title>番茄AI · 极简时间管理</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
